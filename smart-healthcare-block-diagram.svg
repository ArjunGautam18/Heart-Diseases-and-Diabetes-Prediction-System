<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef7f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2d6077"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#16324f}.box-title{font:700 22px Arial,sans-serif;fill:#16324f}.body{font:17px Arial,sans-serif;fill:#3d5668}.small{font:15px Arial,sans-serif;fill:#3d5668}.box{fill:#fff;stroke:#2d6077;stroke-width:2.5;rx:14;filter:url(#shadow)}.model{fill:#e8f4f3;stroke:#2b7a78;stroke-width:2.5;rx:14;filter:url(#shadow)}.result{fill:#fff4df;stroke:#c17c25;stroke-width:2.5;rx:14;filter:url(#shadow)}.line{fill:none;stroke:#2d6077;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="title">Smart Healthcare Disease Prediction System</text>
  <rect x="250" y="100" width="700" height="125" class="box"/><text x="600" y="138" text-anchor="middle" class="box-title">User Input</text><text x="600" y="170" text-anchor="middle" class="body">Age, gender, BMI, blood pressure, glucose</text><text x="600" y="197" text-anchor="middle" class="body">Cholesterol, symptoms and other health values</text>
  <path d="M600 225 V275" class="line"/>
  <rect x="250" y="285" width="700" height="135" class="box"/><text x="600" y="325" text-anchor="middle" class="box-title">Web Application Interface</text><text x="600" y="357" text-anchor="middle" class="body">React frontend collects data and displays results</text><text x="600" y="384" text-anchor="middle" class="small">Forms, dashboard, graphs and health coach chat</text>
  <path d="M600 420 V470" class="line"/>
  <rect x="250" y="480" width="700" height="135" class="box"/><text x="600" y="520" text-anchor="middle" class="box-title">FastAPI Backend</text><text x="600" y="552" text-anchor="middle" class="body">Request handling, validation and API communication</text><text x="600" y="579" text-anchor="middle" class="small">Connects the frontend with prediction services</text>
  <path d="M600 615 V665" class="line"/>
  <rect x="250" y="675" width="700" height="140" class="box"/><text x="600" y="715" text-anchor="middle" class="box-title">Data Preprocessing</text><text x="600" y="747" text-anchor="middle" class="body">Missing-value handling, feature engineering</text><text x="600" y="775" text-anchor="middle" class="body">Encoding, scaling and feature preparation</text>
  <path d="M600 815 V855" class="line"/>
  <rect x="150" y="865" width="900" height="180" class="model"/><text x="600" y="905" text-anchor="middle" class="box-title">Machine Learning Model Layer</text>
  <rect x="190" y="935" width="180" height="65" rx="10" fill="#fff" stroke="#2b7a78" stroke-width="2"/><text x="280" y="974" text-anchor="middle" class="body">Random Forest</text><rect x="390" y="935" width="180" height="65" rx="10" fill="#fff" stroke="#2b7a78" stroke-width="2"/><text x="480" y="974" text-anchor="middle" class="body">Logistic Regression</text><rect x="590" y="935" width="180" height="65" rx="10" fill="#fff" stroke="#2b7a78" stroke-width="2"/><text x="680" y="974" text-anchor="middle" class="body">Decision Tree</text><rect x="790" y="935" width="180" height="65" rx="10" fill="#fff" stroke="#2b7a78" stroke-width="2"/><text x="880" y="974" text-anchor="middle" class="body">Gradient Boosting</text>
  <path d="M385 1045 V1090 H300 V1125" class="line"/><path d="M815 1045 V1090 H900 V1125" class="line"/>
  <rect x="80" y="1135" width="440" height="120" class="result"/><text x="300" y="1175" text-anchor="middle" class="box-title">Heart Disease Prediction</text><text x="300" y="1209" text-anchor="middle" class="body">Predicts heart disease risk</text>
  <rect x="680" y="1135" width="440" height="120" class="result"/><text x="900" y="1175" text-anchor="middle" class="box-title">Diabetes Prediction</text><text x="900" y="1209" text-anchor="middle" class="body">Predicts diabetes risk</text>
  <path d="M300 1255 V1290 H600 V1320" class="line"/><path d="M900 1255 V1290 H600 V1320" class="line"/>
  <rect x="250" y="1330" width="700" height="105" class="box"/><text x="600" y="1370" text-anchor="middle" class="box-title">Risk Assessment and Health Score</text><text x="600" y="1404" text-anchor="middle" class="body">Low / Medium / High risk and score from 0 to 100</text>
  <path d="M600 1435 V1460" class="line"/>
  <rect x="250" y="1470" width="700" height="80" class="box"/><text x="600" y="1502" text-anchor="middle" class="box-title">Recommendations and Dashboard</text><text x="600" y="1528" text-anchor="middle" class="small">Diet, exercise, health tips, results and graphs</text>
</svg>
